<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Page</title>
</head>
<body>
    <h1>Welcome to the Index Page</h1>
    <p>This is the main page of the website.</p>
    <p>Value: {{ value }}</p>
    <p>Result: {{ result }}</p>
    <p>List: {{ list }}</p>

    <ul>
        {% for item in list %}
            {% if item == 3 %}
                <li><strong>{{ item }}</strong></li>
            {%else%}
                <li>{{ item }}</li>
            {% endif %}

            <li>{{ item }}</li>
        
        {% endfor %} 

    </ul>
</body>
</html>
