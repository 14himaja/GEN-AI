<!DOCTYPE html>
<html>
    <head>
        <title>YouTube Chat RAG</title>
        <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e1e2f, #2d2b42); color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
            .card { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 12px; backdrop-filter: blur(10px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); text-align: center; width: 100%; max-width: 400px; border: 1px solid rgba(255, 255, 255, 0.2); }
            input { width: 100%; padding: 12px; margin: 15px 0; border: none; border-radius: 6px; background: rgba(255,255,255,0.2); color: #fff; outline: none; box-sizing: border-box; }
            input::placeholder { color: #ccc; }
            button { width: 100%; padding: 12px; background: #6c5ce7; border: none; border-radius: 6px; color: white; font-size: 16px; cursor: pointer; transition: 0.3s; }
            button:hover { background: #5b4bc4; }
            .loading { display: none; margin-top: 15px; font-size: 14px; color: #a8a8b3; }
            .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #6c5ce7; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>YouTube Chat RAG</h1>
            <p>Load a YouTube Video to chat with it</p>
            <form action="/load-video" method="post" onsubmit="document.getElementById('btn').style.display='none'; document.getElementById('load').style.display='block';">
                <input type="text" name="youtube_url" placeholder="Paste YouTube URL here" required>
                <button type="submit" id="btn">Load Video</button>
                <div id="load" class="loading"><div class="spinner"></div> Processing video and transcripts... Please wait.</div>
            </form>
        </div>
    </body>
</html>
