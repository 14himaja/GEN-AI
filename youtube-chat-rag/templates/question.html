<!DOCTYPE html>
<html>
    <head>
        <title>YouTube Chat RAG</title>
        <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e1e2f, #2d2b42); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
            .card { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 12px; backdrop-filter: blur(10px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); text-align: center; width: 100%; max-width: 500px; border: 1px solid rgba(255, 255, 255, 0.2); }
            input { width: 100%; padding: 12px; margin: 15px 0; border: none; border-radius: 6px; background: rgba(255,255,255,0.2); color: #fff; outline: none; box-sizing: border-box; }
            input::placeholder { color: #ccc; }
            button { width: 100%; padding: 12px; background: #00b894; border: none; border-radius: 6px; color: white; font-size: 16px; cursor: pointer; transition: 0.3s; }
            button:hover { background: #009688; }
            .loading { display: none; margin-top: 15px; font-size: 14px; color: #a8a8b3; }
            .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #00b894; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
            @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            .success { color: #55efc4; margin-bottom: 20px; }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>YouTube Chat RAG</h1>
            <div class="success">Video loaded successfully! ✅</div>
            <h3>Ask a question about the video</h3>
            <form action="/ask" method="post" onsubmit="document.getElementById('btn').style.display='none'; document.getElementById('load').style.display='block';">
                <input type="text" name="query" placeholder="E.g. What is the main topic?" required>
                <button type="submit" id="btn">Ask Question</button>
                <div id="load" class="loading"><div class="spinner"></div> Generating answer... Please wait.</div>
            </form>
        </div>
    </body>
</html>
