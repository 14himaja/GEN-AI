<!DOCTYPE html>
<html>
    <head>
        <title>YouTube Chat RAG</title>

        <style>
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #1e1e2f, #2d2b42);
                color: #fff;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
                padding: 20px;
            }

            .card {
                background: rgba(255, 255, 255, 0.1);
                padding: 30px;
                border-radius: 12px;
                backdrop-filter: blur(10px);
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
                text-align: left;
                width: 100%;
                max-width: 600px;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            h1 {
                text-align: center;
                margin-top: 0;
            }

            .success {
                color: #55efc4;
                text-align: center;
                margin-bottom: 20px;
            }

            input {
                width: 100%;
                padding: 12px;
                margin: 15px 0;
                border: none;
                border-radius: 6px;
                background: rgba(255,255,255,0.2);
                color: #fff;
                outline: none;
                box-sizing: border-box;
            }

            input::placeholder {
                color: #ccc;
            }

            button {
                width: 100%;
                padding: 12px;
                background: #00b894;
                border: none;
                border-radius: 6px;
                color: white;
                font-size: 16px;
                cursor: pointer;
                transition: 0.3s;
            }

            button:hover {
                background: #009688;
            }

            .loading {
                display: none;
                margin-top: 15px;
                font-size: 14px;
                color: #a8a8b3;
                text-align: center;
            }

            .spinner {
                border: 4px solid rgba(255,255,255,0.1);
                border-left-color: #00b894;
                border-radius: 50%;
                width: 24px;
                height: 24px;
                animation: spin 1s linear infinite;
                display: inline-block;
                vertical-align: middle;
                margin-right: 8px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }

            .qa-box {
                background: rgba(0,0,0,0.3);
                padding: 15px;
                border-radius: 8px;
                margin-bottom: 20px;
                border-left: 4px solid #6c5ce7;
            }

            .qa-box h4 {
                margin: 0 0 10px 0;
                color: #a29bfe;
            }

            .qa-box p {
                margin: 0;
                line-height: 1.5;
            }
        </style>
    </head>

    <body>

        <div class="card">

            <h1>YouTube Chat RAG</h1>

            <div class="success">
                Video loaded successfully! ✅
            </div>

            <div class="qa-box" id="qa-question" style="display: none;">

                <h4>Question:</h4>

                <p id="question"></p>

            </div>

            <div class="qa-box" id="qa-answer" style="display: none; border-left-color: #00b894;">

                <h4 style="color: #55efc4;">
                    Answer:
                </h4>

                <p id="answer"></p>

            </div>

            <h3 id="form-heading" style="text-align: center; margin-top: 30px;">
                Ask a question about the video
            </h3>

            <form id="questionForm">

                <input
                    type="text"
                    id="query"
                    name="query"
                    placeholder="E.g. What is the main topic?"
                    required
                >

                <button type="submit" id="btn">
                    Ask Question
                </button>

                <div id="load" class="loading">
                    <div class="spinner"></div>
                    Generating answer... Please wait.
                </div>

            </form>

        </div>


        <script>

            const form = document.getElementById("questionForm");

            form.addEventListener("submit", async function(event) {

                event.preventDefault();

                const query = document.getElementById("query").value;

                document.getElementById("question").textContent = query;

                document.getElementById("answer").textContent = "";
                document.getElementById("qa-question").style.display = "block";
                document.getElementById("qa-answer").style.display = "block";
                document.getElementById("form-heading").textContent = "Ask another question";

                document.getElementById("btn").style.display = "none";

                document.getElementById("load").style.display = "block";


                const formData = new FormData();

                formData.append("query", query);


                const response = await fetch("/ask", {
                    method: "POST",
                    body: formData
                });


                const reader = response.body.getReader();

                const decoder = new TextDecoder();


                while (true) {

                    const { value, done } = await reader.read();

                    if (done) {
                        break;
                    }

                    const text = decoder.decode(value);

                    document.getElementById("answer").textContent += text;

                }


                document.getElementById("btn").style.display = "block";

                document.getElementById("load").style.display = "none";

            });

        </script>

    </body>
</html>
